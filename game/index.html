<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEEL VIPER — Modern Air Combat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191410; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  /* Screen-reader status line: announced, never painted. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage" aria-label="STEEL VIPER, a modern fighter jet combat game. Steer with the mouse, W and S for throttle, Space for cannon, F to launch a locked missile, X for flares."></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/pixi.min.js"></script>
<script src="./vendor/anime.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
